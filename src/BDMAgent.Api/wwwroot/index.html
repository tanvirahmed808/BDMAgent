<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDM Agent</title><style>body{font-family:system-ui;max-width:1100px;margin:40px auto;padding:0 20px;background:#0b1020;color:#eef}h1{margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#171d33;border:1px solid #303956;border-radius:14px;padding:18px}.n{font-size:32px;font-weight:700}button{padding:9px 12px;border-radius:8px;border:0;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px;border-bottom:1px solid #303956;text-align:left}a{color:#9fc3ff}</style></head><body><h1>BDM Agent Platform</h1><p>Software-services business development command centre</p><div id="stats" class="grid"></div><h2>Top Leads</h2><table><thead><tr><th>Company</th><th>Tech</th><th>Score</th><th>Status</th><th>Action</th></tr></thead><tbody id="leads"></tbody></table><p><a href="/swagger">Open API / Swagger</a></p><script>async function load(){let d=await fetch('/api/dashboard').then(r=>r.json());document.querySelector('#stats').innerHTML=Object.entries(d).map(([k,v])=>`<div class=card><div>${k}</div><div class=n>${v}</div></div>`).join('');let l=await fetch('/api/leads').then(r=>r.json());document.querySelector('#leads').innerHTML=l.slice(0,30).map(x=>`<tr><td>${x.company}</td><td>${x.technology}</td><td>${x.score}</td><td>${x.status}</td><td><button onclick="research('${x.id}')">Research</button> <button onclick="draft('${x.id}')">Draft</button></td></tr>`).join('')}async function research(id){await fetch('/api/leads/'+id+'/research',{method:'POST'});load()}async function draft(id){await fetch('/api/leads/'+id+'/draft',{method:'POST'});alert('Draft created for approval');load()}load()</script></body></html>
